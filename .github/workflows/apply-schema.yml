name: Apply Supabase schema

# Runs supabase/schema.sql against the live database whenever that file
# changes on main. Safe to run repeatedly: every statement in schema.sql is
# idempotent (create-if-not-exists, create-or-replace, no drops) — see the
# comment at the top of that file before changing that assumption.

on:
  push:
    branches: [main]
    paths:
      - "supabase/schema.sql"
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply schema.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          set +e
          OUTPUT=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            ESCAPED=$(printf '%s' "$OUTPUT" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::psql exit $STATUS: $ESCAPED"
            exit $STATUS
          fi
